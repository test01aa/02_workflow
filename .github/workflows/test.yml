name: CI
on:
  push:
    branches: [main]

# 環境変数の定義（jobをまたいで変数をやりとりできる）
env:
  VAR_TEST_RET: "var_testの内容です"

jobs:
  test-exec:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Java Test
      run: cd hello && javac *.java && java HelloTest

    - name: End Proc
      run: echo "@@@@@ end @@@@@@@@@@@@"

  after-test:
    # needsを指定すると、jobを順番に実行できる
    needs: test-exec
    runs-on: ubuntu-latest
    steps:
      - name: after test step1
        run: echo "**** after test desu VAR_TEST_RET... ${VAR_TEST_RET}***"
