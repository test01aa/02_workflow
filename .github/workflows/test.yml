name: CI
on: push

jobs:
  test-exec:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Java Test
      run: cd hello && javac *.java && java HelloTest

    - name: End Proc
      run: echo "@@@@@ end @@@@@@@@@@@@"

  after-test:
    # needsを指定すると、jobを順番に実行できる
    needs: test-exec
    runs-on: ubuntu-latest
    steps:
      - name: after test step1
        run: echo "**** after test desu ***"
